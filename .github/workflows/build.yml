name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Select toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Check native panel event targeting
        run: bash scripts/check-panel-events.sh
      - name: Check detection command processes
        run: python3 scripts/check-detection-command.py .build/debug/IceScreen
      - name: Build universal application and DMG
        run: UNIVERSAL=1 bash scripts/build.sh
      - name: Check bundle
        run: |
          plutil -lint dist/IceScreen.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 dist/IceScreen.app
          dist/IceScreen.app/Contents/MacOS/IceScreen --help
          lipo -info dist/IceScreen.app/Contents/MacOS/IceScreen
          ditto -c -k --keepParent dist/IceScreen.app dist/IceScreen-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IceScreen-macOS
          path: |
            dist/IceScreen-macOS.dmg
            dist/IceScreen-macOS.zip
          if-no-files-found: error
