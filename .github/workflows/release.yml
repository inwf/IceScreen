name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '已有版本标签；填写后重新构建并发布该标签'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CHECKOUT_REF: ${{ inputs.tag || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          cache-dependency-glob: 'scripts/*.py'
      - name: Install Cairo for installation background rendering
        run: |
          brew install cairo
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix cairo)/lib:${DYLD_FALLBACK_LIBRARY_PATH:-/usr/local/lib:/usr/lib}" >> "$GITHUB_ENV"
      - name: Test installation background generation and validation
        run: uv run scripts/test-dmg-background.py
      - name: Select toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Check native panel event targeting
        run: bash scripts/check-panel-events.sh
      - name: Check detection command processes
        run: python3 scripts/check-detection-command.py .build/debug/IceScreen
      - name: Build universal application and DMG
        run: UNIVERSAL=1 bash scripts/build.sh
      - name: Check bundle
        run: |
          plutil -lint dist/IceScreen.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 dist/IceScreen.app
          dist/IceScreen.app/Contents/MacOS/IceScreen --help
          lipo -info dist/IceScreen.app/Contents/MacOS/IceScreen
          ditto -c -k --keepParent dist/IceScreen.app dist/IceScreen-macOS.zip
      - name: Check native media bridge
        run: python3 scripts/check-media-bridge.py dist/IceScreen.app
      - name: Create checksums
        run: |
          (cd dist && shasum -a 256 IceScreen-macOS.dmg IceScreen-macOS.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: IceScreen-macOS
          path: |
            dist/IceScreen-macOS.dmg
            dist/IceScreen-macOS.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: IceScreen-macOS
          path: dist
      - name: Publish verified assets and changelog
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/publish-release.sh
