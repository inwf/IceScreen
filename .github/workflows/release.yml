name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '已有版本标签；填写后重新构建并发布该标签'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  prepare:
    name: Select commit and reusable build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      run_id: ${{ steps.select.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select commit and verified artifact
        id: select
        run: python3 scripts/ci_github.py prepare

  build:
    name: Test and package macOS app
    needs: prepare
    if: needs.prepare.outputs.run_id == ''
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
          cache-dependency-glob: 'scripts/*.py'
      - name: Install Cairo for DMG background rendering
        run: |
          brew install cairo
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix cairo)/lib:${DYLD_FALLBACK_LIBRARY_PATH:-/usr/local/lib:/usr/lib}" >> "$GITHUB_ENV"
      - name: Test installation background generation
        run: uv run scripts/test-dmg-background.py
      - name: Test complete icon validation and rejection cases
        run: uv run scripts/test-app-icon.py
      - name: Select toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Test
        run: swift test
      - name: Check detection command processes
        run: python3 scripts/check-detection-command.py .build/debug/IceScreen
      - name: Check native panels, source focus, and full-screen Spaces
        timeout-minutes: 15
        run: bash scripts/check-native-tests.sh --ci
      - name: Save native check diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: IceScreen-native-diagnostics
          path: |
            .build/checks/*.stdout
            .build/checks/*.stderr
            .build/checks/*.result
            .build/focus-checks/*.stdout
            .build/focus-checks/*.stderr
            .build/focus-checks/*.result
            .build/focus-checks/*.jsonl
          if-no-files-found: warn
          retention-days: 3
      - name: Build universal application and DMG
        run: UNIVERSAL=1 bash scripts/build.sh
      - name: Verify application bundle
        run: |
          plutil -lint dist/IceScreen.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 dist/IceScreen.app
          dist/IceScreen.app/Contents/MacOS/IceScreen --help
          lipo -info dist/IceScreen.app/Contents/MacOS/IceScreen
          ditto -c -k --keepParent dist/IceScreen.app dist/IceScreen-macOS.zip
      - name: Check native media bridge
        run: python3 scripts/check-media-bridge.py dist/IceScreen.app
      - name: Create checksums
        run: (cd dist && shasum -a 256 IceScreen-macOS.dmg IceScreen-macOS.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: IceScreen-macOS
          path: |
            dist/IceScreen-macOS.dmg
            dist/IceScreen-macOS.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.prepare.outputs.run_id != '')) &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: IceScreen-macOS
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run_id || github.run_id }}
      - name: Publish verified assets and changelog
        run: bash scripts/publish-release.sh
